{% extends "base.html" %}
{% block title %}Create account | MediConnect{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-intro"><span class="eyebrow" data-i18n="new_patient">NEW PATIENT</span><h1 data-i18n="register_title">Create your account</h1><p data-i18n="register_text">A few details are all you need to get started.</p></div>
  <form method="post" class="form-card">
    <label for="name" data-i18n="full_name">Full name</label><input id="name" name="name" required autocomplete="name" placeholder="Enter your full name">
    <label for="email" data-i18n="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="name@example.com">
    <label for="password" data-i18n="password">Password</label><input id="password" name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters">
    <button class="button button-large full-width" type="submit" data-i18n="create_account">Create account</button>
    <p class="form-bottom"><span data-i18n="already_account">Already registered?</span> <a href="{{ url_for('login') }}" data-i18n="login_here">Log in here</a></p>
  </form>
</section>
{% endblock %}
